version: '3.8'

services:
  # Python FastAPI Backend
  fastapi:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: theme-fastapi
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/docs.db
      - TESSERACT_CMD=/usr/bin/tesseract
      - GEMINI_API_KEY=
      - OPENAI_API_KEY=
    volumes:
      - fastapi_data:/app/data
    networks:
      - theme-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Spring Boot Middleware
  springboot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: theme-springboot
    ports:
      - "8080:8080"
    environment:
      - APP_GEMINI_API_KEY=
      - APP_GEMINI_MODEL=gemini-2.0-flash
      - APP_GROUNDEDNESS_THRESHOLD=0.6
      - APP_FASTAPI_BASE_URL=http://fastapi:8000
      - APP_FASTAPI_TIMEOUT_SECONDS=60
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      fastapi:
        condition: service_healthy
    networks:
      - theme-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # React Frontend
  react:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: theme-react
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://springboot:8080/api
    depends_on:
      springboot:
        condition: service_healthy
    networks:
      - theme-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  fastapi_data:

networks:
  theme-network:
    driver: bridge