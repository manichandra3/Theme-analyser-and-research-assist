server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  gemini-api-key: ${GEMINI_API_KEY:}
  gemini-model: gemini-2.0-flash
  groundedness-threshold: 0.6
  fastapi:
    base-url: http://localhost:8000
    timeout-seconds: 60